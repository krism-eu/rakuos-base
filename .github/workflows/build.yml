name: Build RakuOS Base

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rakuos-base-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: krism-eu/rakuos-base

jobs:
  build-base:
    name: Build and publish RakuOS Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build base image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: rakuos-base
          tags: minimal-base
          containerfiles: |
            ./Containerfile
          context: .

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push base image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
