name: Build RakuOS Base

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/krism-eu/rakuos-base

jobs:
  build-base:
    name: Build and publish RakuOS Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildah
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: redhat-actions/buildah-build@v2
        with:
          image: rakuos-base
          tags: minimal-base
          containerfiles: |
            ./Containerfile
          context: .

      - name: Test bootc image
        run: |
          podman run --rm \
            --entrypoint bootc \
            rakuos-base:minimal-base \
            container lint

      - name: Tag image
        run: |
          podman tag \
            rakuos-base:minimal-base \
            ${{ env.IMAGE_NAME }}:minimal-base

      - name: Push base image
        run: |
          podman push \
            ${{ env.IMAGE_NAME }}:minimal-base
